name: Validate package and API bridge

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/manage.py validate
      - run: python -m unittest discover -s tests -v
      - run: python tools/manage.py pack --kind plugin --output dist/recon3d-plugin.zip
      - run: python tools/manage.py pack --kind skill --output dist/recon3d-skill.zip
