  <g id="text_23">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="79.2" y="375.84" transform="rotate(-0 79.2 375.84)">Rule-based = repeated scan; Our system = indexed mapping. Links count each input row and reaction pair.</text>
