  </g>
  <g id="text_25">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="79.2" y="408.24" transform="rotate(-0 79.2 408.24)">Membership in a GPR expression only. Biological accuracy, route yield, Laya/Jev and full runtime were not measured.</text>
